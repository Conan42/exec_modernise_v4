[workspace]
resolver = "3"
members = [
    "protocol",
    "filesystem",
    "exec",
    "host/jupiter2ctl",
    "firmware/bonjour",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
readme = "README.md"
description = "Bring-up Rust et contrats portables d'Exec Modernisé sur Milk-V Jupiter 2"

[workspace.dependencies]
exec-modernise-v4-protocol = { path = "protocol" }
filesystem-v4 = { path = "filesystem" }
exec-v4 = { path = "exec" }
